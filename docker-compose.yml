services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: reliability
    volumes:
      - reliability_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reliability"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: local-compose
      APP_VERSION: 0.1.0
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/reliability
      ENABLE_FAULT_INJECTION: "true"
      FAULT_ADMIN_TOKEN: local-demo-token
      RECOVERY_SUCCESS_THRESHOLD: "2"
      INCIDENT_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  reliability_postgres_data:
